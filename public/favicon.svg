<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#854CE6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#306ee8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle with dark color similar to website dark card -->
  <circle cx="50" cy="50" r="46" fill="#171721" stroke="url(#grad)" stroke-width="4" />
  <!-- Glowing developer symbol -->
  <path d="M35 35 L20 50 L35 65 M65 35 L80 50 L65 65 M44 68 L56 32" 
        fill="none" 
        stroke="url(#grad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
